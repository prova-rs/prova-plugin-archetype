# One manifest, two hats. In Prova a package is one prova.toml-rooted unit; this one both exports a
# namespace (a package — `[package]`) and runs its own proofs (a suite). Author the package in
# init.lua; prove it in proofs/; ship both together.
[package]
name        = "{{ name }}"
description = "{{ description }}"
license     = "MIT"

# The range of prova versions this package is built against; a consumer is checked against it.
[requires]
prova = ">= 0.16"

# Resolve THIS package from its own directory, so the self-tests can `require("{{ name }}")` exactly as
{% if standalone %}
# a consumer would. A CONSUMER instead pins it by source — a released tag:
#   {{ name }} = { git = "https://github.com/{{ org }}/prova-{{ name }}", tag = "v1" }
{% else %}
# a consumer would. The owning project needs no declaration at all — this directory lives under its
# packages, so `require("{{ name }}")` already resolves from any proof.
{% endif %}
[dependencies]
{{ name }} = { path = "." }
